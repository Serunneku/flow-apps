<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Mes apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root { color-scheme: light dark; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    max-width: 480px;
    margin: 60px auto;
    padding: 0 20px;
    color: #14161a;
    background: #f5f6f8;
  }
  @media (prefers-color-scheme: dark) {
    body { color: #f2f3f5; background: #0f1115; }
    a { color: #7fb3ff; }
  }
  h1 { font-size: 24px; }
  .card {
    display: block;
    padding: 18px;
    border-radius: 14px;
    border: 1px solid rgba(128,128,128,0.3);
    margin-bottom: 12px;
    text-decoration: none;
    color: inherit;
  }
  .card b { display: block; font-size: 17px; margin-bottom: 4px; }
  .card span { font-size: 13px; opacity: 0.7; }
</style>
</head>
<body>
  <h1>Mes apps</h1>
  <a class="card" href="focusflow/">
    <b>🎯 FocusFlow</b>
    <span>Tâches et habitudes quotidiennes</span>
  </a>
  <a class="card" href="noteflow/">
    <b>📝 NoteFlow</b>
    <span>Notes texte et dessin, synchronisées</span>
  </a>
</body>
</html>
