<!doctype html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>Mes apps</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)" />
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f7;
    --bg-2: #ececef;
    --text: #1d1d1f;
    --muted: #6e6e73;
    --card: rgba(255, 255, 255, 0.72);
    --card-border: rgba(0, 0, 0, 0.06);
    --shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.06);
    --shadow-hover: 0 2px 4px rgba(0,0,0,0.06), 0 16px 40px rgba(0,0,0,0.10);
  }

  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #000000;
      --bg-2: #0a0a0c;
      --text: #f5f5f7;
      --muted: #98989d;
      --card: rgba(28, 28, 30, 0.72);
      --card-border: rgba(255, 255, 255, 0.08);
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 24px rgba(0,0,0,0.4);
      --shadow-hover: 0 2px 4px rgba(0,0,0,0.4), 0 16px 40px rgba(0,0,0,0.5);
    }
  }

  * { box-sizing: border-box; }

  html, body {
    height: 100%;
    margin: 0;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
    color: var(--text);
    background:
      radial-gradient(600px circle at 15% -10%, rgba(120, 160, 255, 0.16), transparent 60%),
      radial-gradient(500px circle at 90% 0%, rgba(255, 170, 100, 0.12), transparent 55%),
      var(--bg);
    background-attachment: fixed;
    -webkit-font-smoothing: antialiased;
    min-height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 40px 20px;
  }

  main {
    width: 100%;
    max-width: 420px;
  }

  .eyebrow {
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.08em;
    margin: 0 0 6px;
  }

  h1 {
    text-align: center;
    font-size: 34px;
    font-weight: 700;
    letter-spacing: -0.02em;
    margin: 0 0 40px;
  }

  .apps {
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .card {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 16px;
    border-radius: 20px;
    background: var(--card);
    border: 1px solid var(--card-border);
    backdrop-filter: blur(20px) saturate(180%);
    -webkit-backdrop-filter: blur(20px) saturate(180%);
    box-shadow: var(--shadow);
    text-decoration: none;
    color: inherit;
    transition: transform 0.25s cubic-bezier(.2,.8,.2,1), box-shadow 0.25s ease;
  }

  .card:hover {
    transform: translateY(-2px) scale(1.01);
    box-shadow: var(--shadow-hover);
  }

  .card:active {
    transform: translateY(0) scale(0.99);
  }

  .icon {
    width: 52px;
    height: 52px;
    min-width: 52px;
    border-radius: 14px;
    box-shadow: 0 1px 1px rgba(0,0,0,0.08), 0 4px 10px rgba(0,0,0,0.12);
  }

  .card .body {
    min-width: 0;
  }

  .card b {
    display: block;
    font-size: 17px;
    font-weight: 600;
    letter-spacing: -0.01em;
    margin-bottom: 2px;
  }

  .card span {
    font-size: 13px;
    color: var(--muted);
  }

  .chevron {
    margin-left: auto;
    color: var(--muted);
    opacity: 0.6;
    font-size: 18px;
  }

  footer {
    text-align: center;
    margin-top: 36px;
    font-size: 12px;
    color: var(--muted);
  }
</style>
</head>
<body>
  <main>
    <p class="eyebrow">Applications personnelles</p>
    <h1>Mes apps</h1>
    <div class="apps">
      <a class="card" href="focusflow/">
        <img class="icon" src="focusflow/icons/icon-192.png" alt="" />
        <div class="body">
          <b>FocusFlow</b>
          <span>Tâches et habitudes quotidiennes</span>
        </div>
        <span class="chevron">›</span>
      </a>
      <a class="card" href="noteflow/">
        <img class="icon" src="noteflow/icons/icon-192.png" alt="" />
        <div class="body">
          <b>NoteFlow</b>
          <span>Notes texte et dessin, synchronisées</span>
        </div>
        <span class="chevron">›</span>
      </a>
    </div>
    <footer>Installables sur Mac, iPhone et Windows</footer>
  </main>
</body>
</html>
